name: CD (main -> EC2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "${{ secrets.APP_DIR }}/releases"

      - name: Restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            APP_DIR="${{ secrets.APP_DIR }}"
            RELEASES_DIR="$APP_DIR/releases"
            CURRENT_DIR="$APP_DIR/current"

            mkdir -p "$RELEASES_DIR" "$CURRENT_DIR"

            LATEST_JAR=$(find "$RELEASES_DIR" -name "*.jar" | sort | tail -n 1)
            if [ -z "$LATEST_JAR" ]; then
              echo "No jar found in $RELEASES_DIR"
              exit 1
            fi

            cp "$LATEST_JAR" "$CURRENT_DIR/app.jar"

            PID=$(pgrep -f "$CURRENT_DIR/app.jar" || true)
            if [ -n "$PID" ]; then
              kill "$PID" || true
              sleep 2
            fi

            (nohup java -jar "$CURRENT_DIR/app.jar" > "$APP_DIR/app.log" 2>&1 < /dev/null &) >/dev/null 2>&1

            sleep 1
            pgrep -f "$CURRENT_DIR/app.jar" >/dev/null && echo "App started" || (echo "App not running"; tail -n 50 "$APP_DIR/app.log"; exit 1)
