name: CD (main -> EC2)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Show JAR size
        run: |
          ls -al build/libs
          du -h build/libs/*.jar || true

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ec2_key.pem
          chmod 600 /tmp/ec2_key.pem

      - name: Upload JAR (native scp)
        run: |
          JAR=$(ls build/libs/*.jar | head -n 1)

          ssh -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ secrets.APP_DIR }}/releases ${{ secrets.APP_DIR }}/current"

          scp -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            "$JAR" \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.APP_DIR }}/releases/app.jar

      - name: Restart app (ssh)
        run: |
          ssh -i /tmp/ec2_key.pem -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "set -e
             pkill -f 'java -jar' || true
             cp ${{ secrets.APP_DIR }}/releases/app.jar ${{ secrets.APP_DIR }}/current/app.jar
             nohup java -jar ${{ secrets.APP_DIR }}/current/app.jar > ${{ secrets.APP_DIR }}/app.log 2>&1 &
             sleep 1
             ps -ef | grep java | head -n 5 || true
            "
